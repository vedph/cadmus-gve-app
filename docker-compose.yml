services:
  # MongoDB
  cadmus-gve-mongo:
    image: mongo
    container_name: cadmus-gve-mongo
    environment:
      - MONGO_DATA_DIR=/data/db
      - MONGO_LOG_DIR=/dev/null
    command: mongod --logpath=/dev/null
    ports:
      - 27017:27017
    networks:
      - cadmus-gve-network

 # PostgreSQL
  cadmus-gve-pgsql:
    image: postgres
    container_name: cadmus-gve-pgsql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - 5432:5432
    networks:
      - cadmus-gve-network

  # Cadmus gve API
  cadmus-gve-api:
    image: vedph2020/cadmus-gve-api:5.0.2
    container_name: cadmus-gve-api
    ports:
      - 5092:8080
    depends_on:
      - cadmus-gve-mongo
      - cadmus-gve-pgsql
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - CONNECTIONSTRINGS__DEFAULT=mongodb://cadmus-gve-mongo:27017/{0}
      - CONNECTIONSTRINGS__AUTH=Server=cadmus-gve-pgsql;port=5432;Database={0};User Id=postgres;Password=postgres;Include Error Detail=True
      - CONNECTIONSTRINGS__INDEX=Server=cadmus-gve-pgsql;port=5432;Database={0};User Id=postgres;Password=postgres;Include Error Detail=True
      - SERILOG__CONNECTIONSTRING=mongodb://cadmus-gve-mongo:27017/{0}-log
      - STOCKUSERS__0__PASSWORD=P4ss-W0rd!
      - SEED__DELAY=20
      - MESSAGING__APIROOTURL=http://cadmusapi.azurewebsites.net
      - MESSAGING__APPROOTURL=http://cadmusapi.com/
      - MESSAGING__SUPPORTEMAIL=support@cadmus.com
    networks:
      - cadmus-gve-network

  # Cadmus gve App
  cadmus-gve-app:
    image: vedph2020/cadmus-gve-app:6.1.0
    container_name: cadmus-gve-app
    ports:
      - 4200:80
    depends_on:
      - cadmus-gve-api
    networks:
      - cadmus-gve-network

networks:
  cadmus-gve-network:
    driver: bridge
