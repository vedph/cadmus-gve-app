<form [formGroup]="form" (submit)="save()">
  <mat-card>
    <mat-card-header>
      <div mat-card-avatar>
        <mat-icon>picture_in_picture</mat-icon>
      </div>
      <mat-card-title>{{
        (modelName() | titlecase) || "Snapshot Part"
      }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <gve-snapshot-editor
        [featureDefs]="featDefs()"
        [multiValuedFeatureIds]="multiValuedFeatureIds()"
        [renditionSettings]="renditionSettings()"
        [noSave]="userLevel < 2"
        [snapshot]="snapshot.value || undefined"
        (snapshotCancel)="close()"
        (snapshotChange)="onSnapshotChange($event!)"
      />
    </mat-card-content>
  </mat-card>
</form>
